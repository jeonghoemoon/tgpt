[package]
name = "tgpt"
version = "0.1.0"
edition = "2021"
description = "🤖 AI-powered terminal assistant — chat, command generation, and code review from your terminal"
authors = []
license = "MIT"
repository = "https://github.com/jeonghoemoon/tgpt"
keywords = ["ai", "llm", "terminal", "cli", "openai"]
categories = ["command-line-utilities"]
readme = "README.md"

[[bin]]
name = "tgpt"
path = "src/main.rs"

[dependencies]
tokio        = { version = "1",    features = ["full"] }
clap         = { version = "4",    features = ["derive", "color"] }
serde        = { version = "1",    features = ["derive"] }
serde_json   = "1"
reqwest      = { version = "0.12", features = ["json", "stream"] }
anyhow       = "1"
colored      = "2"
dialoguer    = "0.11"
indicatif    = "0.17"
dirs         = "5"
futures-util = "0.3"
crossterm    = "0.28"
async-trait  = "0.1"
tokio-util   = { version = "0.7", features = ["io"] }
bytes        = "1"
chrono       = { version = "0.4", features = ["serde"] }
uuid         = { version = "1",   features = ["v4"] }

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true
